services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nordflow
      POSTGRES_USER: nordflow
      POSTGRES_PASSWORD: nordflow
    ports: ["5432:5432"]
    volumes:
      - nordflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordflow -d nordflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - nordflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nordflow_pg:
  nordflow_redis:
